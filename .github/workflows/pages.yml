name: Сайт Кодекса (GitHub Pages)

on:
  push:
    branches: [main, handouts]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Раздатки для игроков (ветка handouts)
        uses: actions/checkout@v4
        with:
          ref: handouts
          path: _handouts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сборка сайта
        run: |
          cd site && npm install --no-audit --no-fund && cd ..
          node site/build.mjs _site
          rm -rf _handouts/.git _handouts/README.md
          cp -r _handouts/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
